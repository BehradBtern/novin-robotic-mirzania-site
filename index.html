<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191B">
  <meta name="description" id="meta-description" content="">
  <title>Robotics Institute</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="content.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#footer">Skip to footer</a>
  <noscript><p class="noscript-note">This site requires JavaScript.</p></noscript>

  <!-- ====================== LOGO STAGE (spins, travels, docks) ====================== -->
  <section class="hero" id="story" aria-label="Logo animation">
    <div class="hero__sticky">
      <div class="hero__stage">
        <div class="hero__diagram" id="hero-diagram" aria-hidden="true">
          <svg class="hero__diagram-svg" viewBox="-160 -160 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="dia__circle" id="diagram-circle" cx="0" cy="0" r="150"/>
            <g class="dia__ticks" aria-hidden="true">
              <line x1="0" y1="-150" x2="0" y2="-134"/>
              <line x1="150" y1="0" x2="134" y2="0"/>
              <line x1="0" y1="150" x2="0" y2="134"/>
              <line x1="-150" y1="0" x2="-134" y2="0"/>
            </g>
            <g class="dia__ring" id="diagram-ring">
              <circle class="dia__dashed" cx="0" cy="0" r="126"/>
            </g>
          </svg>
          <p class="hero__diagram-label hero__diagram-label--top" id="diagram-top"></p>
          <p class="hero__diagram-label hero__diagram-label--bottom" id="diagram-bottom"></p>
        </div>
        <aside class="hero__side hero__side--left" id="hero-side-left">
          <p class="hero__side-kicker"></p>
          <h2 class="hero__side-title"></h2>
          <p class="hero__side-body"></p>
        </aside>
        <aside class="hero__side hero__side--right" id="hero-side-right">
          <p class="hero__side-kicker"></p>
          <h2 class="hero__side-title"></h2>
          <p class="hero__side-body"></p>
        </aside>
        <div class="hero__frame" id="hero-frame">
          <img class="hero__wordmark" id="hero-wordmark" src="" alt="" aria-hidden="true" decoding="async">
          <span class="hero__markbox" id="hero-markbox">
            <img class="hero__mark" id="hero-mark" src="" alt="" aria-hidden="true" decoding="async">
          </span>
        </div>
      </div>
    </div>
  </section>

  <!-- ================================== FOOTER =================================== -->
  <!-- Columns, then the giant animated brand text over a radial glow,
       then the legal row. -->
  <footer class="footer" id="footer">
    <div class="footer__glow" aria-hidden="true"></div>
    <div class="shell footer__inner">
      <div class="footer__grid">
        <div class="footer__brand">
          <img class="footer__logo" id="footer-logo" src="" alt="" decoding="async" loading="lazy">
          <p class="footer__blurb" id="footer-blurb"></p>
        </div>
        <div class="footer__col" id="contact">
          <p class="footer__label">Contact</p>
          <ul class="footer__list">
            <li><a id="footer-email" href="#"></a></li>
            <li><a id="footer-phone" href="#"></a></li>
            <li class="footer__address" id="footer-address"></li>
          </ul>
        </div>
        <nav class="footer__col" aria-label="Sections">
          <p class="footer__label">Sections</p>
          <ul class="footer__list" id="footer-explore"></ul>
        </nav>
      </div>

      <!-- signature: three text layers — outline echo, stroke draw-in, and the
           cursor-following rainbow reveal (ported from the supplied snippet) -->
      <div class="footer__signature" id="footer-signature" aria-hidden="true">
        <svg class="sig" id="sig-svg" viewBox="0 0 300 38" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" focusable="false">
          <defs>
            <linearGradient id="textGradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
              <stop offset="0%" stop-color="#eab308"/>
              <stop offset="25%" stop-color="#ef4444"/>
              <stop offset="50%" stop-color="#80eeb4"/>
              <stop offset="75%" stop-color="#06b6d4"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
            <radialGradient id="revealMask" gradientUnits="userSpaceOnUse" cx="50%" cy="50%" r="20%">
              <stop offset="0%" stop-color="white"/>
              <stop offset="100%" stop-color="black"/>
            </radialGradient>
            <mask id="textMask">
              <rect x="0" y="0" width="100%" height="100%" fill="url(#revealMask)"/>
            </mask>
          </defs>
          <text class="sig__echo" x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" stroke-width="0.3" fill="transparent" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="21"></text>
          <text class="sig__draw" x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" stroke-width="0.3" fill="transparent" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="21"></text>
          <text class="sig__rainbow" x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" stroke-width="0.3" fill="transparent" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="21" stroke="url(#textGradient)" mask="url(#textMask)"></text>
        </svg>
      </div>

      <div class="footer__legal">
        <p id="footer-legal"></p>
        <p class="footer__credit" id="footer-credit"></p>
      </div>
    </div>
  </footer>
</body>
</html>
