<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191B">
  <title>Robotics Institute</title>
  <meta name="description" id="meta-description" content="">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="content.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#programmes">Skip to gallery</a>
  <noscript><p class="noscript-note">This site requires JavaScript. Please enable it to view the full experience.</p></noscript>

  <!-- ============================ HERO / STORY ============================ -->
  <section class="hero" id="story" aria-label="Introduction">
    <div class="hero__sticky">
      <div class="hero__stage">
        <div class="hero__persp" id="hero-persp">
          <div class="hero__frame" id="hero-frame">
            <img class="hero__wordmark" id="hero-wordmark" src="" alt="" aria-hidden="true" decoding="async">
            <span class="hero__markbox" id="hero-markbox">
              <img class="hero__mark" id="hero-mark" src="" alt="" aria-hidden="true" decoding="async">
            </span>
          </div>
        </div>

        <div class="hero__copy" id="hero-copy">
          <div class="hero__col hero__col--left" id="hero-copy-left">
            <p class="kicker" id="hero-left-kicker"></p>
            <h1 class="hero__headline" id="hero-left-headline"></h1>
            <p class="hero__body" id="hero-left-body"></p>
          </div>
          <div class="hero__col hero__col--right" id="hero-copy-right">
            <p class="kicker" id="hero-right-kicker"></p>
            <h2 class="hero__headline hero__headline--sm" id="hero-right-headline"></h2>
            <p class="hero__body" id="hero-right-body"></p>
          </div>
        </div>

        <p class="hero__indicator" id="hero-indicator" aria-hidden="true"></p>
        <p class="hero__hint" id="hero-hint" aria-hidden="true"><span data-field="hero.scrollHint"></span></p>
        <img class="rm-mark" id="rm-mark" src="" alt="" aria-hidden="true" decoding="async">
      </div>
    </div>
  </section>

  <!-- ============================== GALLERY =============================== -->
  <section class="gallery" id="programmes" aria-labelledby="gallery-title">
    <div class="shell">
      <div class="gallery__head">
        <p class="kicker" id="gallery-label"></p>
        <h2 class="gallery__title" id="gallery-title"></h2>
        <p class="gallery__intro" id="gallery-intro"></p>
      </div>
      <div class="gallery__rows" id="gallery-rows"></div>
    </div>
  </section>

  <!-- =============================== FOOTER =============================== -->
  <footer class="footer" id="footer">
    <div class="shell">
      <div class="footer__grid">
        <div class="footer__brand">
          <img class="footer__logo" id="footer-logo" src="" alt="" decoding="async" loading="lazy">
          <p class="footer__blurb" id="footer-blurb"></p>
        </div>
        <div class="footer__col" id="contact">
          <p class="footer__label">Contact</p>
          <ul class="footer__list">
            <li><a id="footer-email" href="#"></a></li>
            <li><a id="footer-phone" href="#"></a></li>
            <li class="footer__address" id="footer-address"></li>
          </ul>
        </div>
        <nav class="footer__col" aria-label="Sections">
          <p class="footer__label">Sections</p>
          <ul class="footer__list" id="footer-explore"></ul>
        </nav>
      </div>
      <div class="footer__legal">
        <p id="footer-legal"></p>
        <p class="footer__credit" id="footer-credit"></p>
      </div>
    </div>
  </footer>
</body>
</html>
